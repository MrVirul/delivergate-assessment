services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: icecream
      POSTGRES_PASSWORD: icecream
      POSTGRES_DB: icecream
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icecream -d icecream"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
