<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scoop & Co. - Inventory</title>
  <meta name="htmx-config" content='{"allowEval":false,"selfRequestsOnly":true,"defaultSwapStyle":"innerHTML","responseHandling":[{"code":"204","swap":true},{"code":"[23]..","swap":true},{"code":"[45]..","swap":false,"error":true},{"code":"...","swap":false}]}'>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/vendor/htmx.min.js"></script>
  <script src="/js/render.js"></script>
  <script src="/js/api-ext.js"></script>
  <script src="/js/app.js"></script>
</head>
<body hx-ext="api">
  <header>
    <div class="brand">
      <div class="brand-name">Scoop & Co.</div>
    </div>
    <div class="user-info">
      <span id="user-name"></span>
      <span id="user-role" class="role-badge"></span>
      <button id="logout-btn" class="btn">Log out</button>
    </div>
  </header>
  <nav class="tabs">
    <button class="tab active" data-target="inventory-panel">Inventory</button>
    <button class="tab" data-target="customers-panel">Customers</button>
  </nav>
  <main>
    <section id="inventory-panel" class="tab-panel">
      <div class="panel filters" id="items-filters">
        <input type="search" name="search" placeholder="Search items..." hx-get="/api/items" hx-target="#items-results" data-render="items-list" hx-trigger="input changed delay:300ms" hx-include="#items-filters" hx-sync="this:replace">
        <select name="category" hx-get="/api/items" hx-target="#items-results" data-render="items-list" hx-trigger="change" hx-include="#items-filters">
          <option value="">All categories</option>
          <option value="flavor">flavor</option>
          <option value="topping">topping</option>
          <option value="cone">cone</option>
          <option value="cup">cup</option>
          <option value="packaging">packaging</option>
          <option value="other">other</option>
        </select>
        <label><input type="checkbox" name="low_stock" value="true" hx-get="/api/items" hx-target="#items-results" data-render="items-list" hx-trigger="change" hx-include="#items-filters"> Low stock only</label>
        <select name="sort" hx-get="/api/items" hx-target="#items-results" data-render="items-list" hx-trigger="change" hx-include="#items-filters">
          <option value="name">Name</option>
          <option value="-name">Name (desc)</option>
          <option value="quantity">Quantity</option>
          <option value="price_cents">Price</option>
          <option value="-created_at">Newest</option>
        </select>
        <button id="add-item-btn" class="btn btn-primary" type="button" onclick="openItemAdd()">Add item</button>
      </div>
      <div id="items-results" hx-get="/api/items" hx-include="#items-filters" hx-trigger="load, items-changed from:body" data-render="items-list"></div>
    </section>
    <section id="customers-panel" class="tab-panel" style="display:none;">
      <div class="panel filters" id="customers-filters">
        <input type="search" name="search" placeholder="Search customers..." hx-get="/api/customers" hx-target="#customers-results" data-render="customers-list" hx-trigger="input changed delay:300ms" hx-include="#customers-filters" hx-sync="this:replace">
        <select name="sort" hx-get="/api/customers" hx-target="#customers-results" data-render="customers-list" hx-trigger="change" hx-include="#customers-filters">
          <option value="name">Name</option>
          <option value="-created_at">Newest</option>
        </select>
        <button id="add-customer-btn" class="btn btn-primary" type="button" onclick="openCustomerAdd()">Add customer</button>
      </div>
      <div id="customers-results" hx-get="/api/customers" hx-include="#customers-filters" hx-trigger="load, customers-changed from:body" data-render="customers-list"></div>
    </section>
  </main>
  <dialog id="modal">
    <div class="dialog-header">
      <strong id="modal-title">Form</strong>
      <button class="btn btn-ghost" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body" class="dialog-body"></div>
  </dialog>
  <div id="toast-container" class="toast-container"></div>
</body>
</html>
