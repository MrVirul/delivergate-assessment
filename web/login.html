<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scoop & Co. - Login</title>
  <meta name="htmx-config" content='{"allowEval":false,"selfRequestsOnly":true,"defaultSwapStyle":"innerHTML","responseHandling":[{"code":"204","swap":true},{"code":"[23]..","swap":true},{"code":"[45]..","swap":false,"error":true},{"code":"...","swap":false}]}'>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/vendor/htmx.min.js"></script>
  <script src="/js/render.js"></script>
  <script src="/js/api-ext.js"></script>
  <script src="/js/app.js"></script>
</head>
<body hx-ext="api">
  <main style="max-width:420px;margin-top:10vh;">
    <div class="panel">
      <h1 style="margin-top:0;">Scoop & Co.</h1>
      <p style="color:var(--cocoa-soft);">Sign in to continue</p>
      <form id="login-form" hx-post="/api/auth/login" hx-swap="none" hx-disabled-elt="find button[type=submit]">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Sign in</button>
        <div id="login-error" style="color:#d32f2f;margin-top:0.75rem;"></div>
      </form>
    </div>
  </main>
  <div id="toast-container" class="toast-container"></div>
  <script>
    // Check if already logged in
    try {
      const u = JSON.parse(sessionStorage.getItem('user')||'null');
      const t = sessionStorage.getItem('token');
      if (u && t) { window.location.replace('/'); }
    } catch(e) {}
    document.body.addEventListener('htmx:afterRequest', (evt) => {
      const path = evt.detail.pathInfo?.requestPath || '';
      if (path.includes('/api/auth/login')) {
        if (evt.detail.successful && evt.detail.xhr) {
          try {
            const res = JSON.parse(evt.detail.xhr.responseText);
            if (res.data) {
              sessionStorage.setItem('token', res.data.access_token);
              sessionStorage.setItem('user', JSON.stringify(res.data.user));
              sessionStorage.setItem('expires_at', String(Date.now() + res.data.expires_in*1000));
              window.location.replace('/');
            }
          } catch(e) {
            document.getElementById('login-error').textContent = 'Login failed';
          }
        } else {
          document.getElementById('login-error').textContent = 'Invalid email or password';
        }
      }
    });
  </script>
</body>
</html>
