<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scoop & Co. - Login</title>
  <meta name="htmx-config" content='{"allowEval":false,"selfRequestsOnly":true,"defaultSwapStyle":"innerHTML","responseHandling":[{"code":"204","swap":true},{"code":"[23]..","swap":true},{"code":"[45]..","swap":false,"error":true},{"code":"...","swap":false}]}'>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/vendor/htmx.min.js"></script>
  <script src="/js/render.js"></script>
  <script src="/js/api-ext.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/login.js"></script>
  <script src="/js/confirm.js"></script>
</head>
<body hx-ext="api">
  <main style="max-width:420px;margin:10vh auto 0;padding:1rem;">
    <div class="panel">
      <h1 style="margin-top:0;">Scoop & Co.</h1>
      <p style="color:var(--cocoa-soft);">Sign in to continue</p>
      <form id="login-form" hx-post="/api/auth/login" hx-swap="none" hx-disabled-elt="find button[type=submit]">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Sign in</button>
        <div id="login-error" style="color:#d32f2f;margin-top:0.75rem;"></div>
      </form>
    </div>
  </main>
  <div id="toast-container" class="toast-container"></div>
</body>
</html>
